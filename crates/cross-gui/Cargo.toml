[package]
name = "cross-gui"
description = "Desktop app for cross-app (Tauri 2)"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs a newer compiler than the rest of the workspace.
rust-version = "1.90"
license.workspace = true

[[bin]]
name = "cross-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cross-bottle = { path = "../cross-bottle" }
cross-compat = { path = "../cross-compat" }
cross-core = { path = "../cross-core" }
cross-deps = { path = "../cross-deps" }
cross-engine = { path = "../cross-engine" }
cross-steam = { path = "../cross-steam" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
